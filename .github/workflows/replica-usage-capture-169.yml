# TEST ONLY (relevo #169): main agent on sonnet launching three haiku subagents named like replicas, to check that run-usage.mjs estimates their cost from a real
# log (the main agent uses a model that the replicas do not).
# workflow_dispatch only. Costs a few cents of the subscription token each time it is started.
name: replica-usage-capture-169
on:
  workflow_dispatch:
  push:
    branches: [test/replica-cost-169]
    paths: ['.github/workflows/replica-usage-capture-169.yml']
permissions:
  contents: read
jobs:
  capture:
    # A push only registers the workflow, so that it can be dispatched: the job does nothing then.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - id: agent
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: >-
            Launch exactly three subagents, one after another, with the Agent tool and subagent_type general-purpose.
            The description parameter of the first must be exactly "replica 2.1", of the second exactly "replica 2.2", of the third
            exactly "replica 2.2". Pass the parameter model with the value "haiku" in each call. The prompt of each is: Reply with the single word ok and use no tools.
            When the three have answered, reply with the single word done.
          claude_args: >-
            --model sonnet
            --max-turns 10
            --max-budget-usd 0.5
            --allowedTools "Task,Agent"
      - name: Show the Agent calls of the real log and run run-usage.mjs on it
        env:
          EXECUTION_FILE: ${{ steps.agent.outputs.execution_file }}
        run: |
          echo "--- Agent calls (only the keys of the input, and description/subagent_type/model)"
          node -e '
            const t = require("fs").readFileSync(process.env.EXECUTION_FILE, "utf8");
            let all; try { all = JSON.parse(t); } catch { all = t.split("\n").filter(Boolean).map((l) => JSON.parse(l)); }
            const calls = [];
            all.forEach((e) => { if (e.type === "assistant" && Array.isArray(e.message?.content)) e.message.content.forEach((c) => { if (c?.type === "tool_use" && (c.name === "Agent" || c.name === "Task")) calls.push({ tool: c.name, id: c.id, keys: Object.keys(c.input ?? {}), description: c.input?.description, subagent_type: c.input?.subagent_type, model: c.input?.model }); }); });
            console.log(JSON.stringify(calls, null, 1));
            const started = all.filter((e) => e.type === "system" && e.subtype === "task_started").map((e) => ({ tool_use_id: e.tool_use_id, subagent_type: e.subagent_type, description: e.description }));
            console.log("--- task_started"); console.log(JSON.stringify(started, null, 1));
          '
          echo "--- messages per parent_tool_use_id (does the log carry the subagents' own messages and usage?)"
          node -e '
            const t = require("fs").readFileSync(process.env.EXECUTION_FILE, "utf8");
            let all; try { all = JSON.parse(t); } catch { all = t.split("\n").filter(Boolean).map((l) => JSON.parse(l)); }
            const by = {};
            all.forEach((e) => { if (e.type === "assistant") { const k = e.parent_tool_use_id ?? "main"; by[k] ??= { n: 0, models: new Set(), hasUsage: 0 }; by[k].n++; if (e.message?.model) by[k].models.add(e.message.model); if (e.message?.usage) by[k].hasUsage++; } });
            console.log(JSON.stringify(Object.fromEntries(Object.entries(by).map(([k, v]) => [k, { n: v.n, models: [...v.models], hasUsage: v.hasUsage }])), null, 1));
            console.log(JSON.stringify(all.filter((e) => e.type === "system" && e.subtype === "task_notification").map((e) => ({ id: e.tool_use_id, keys: Object.keys(e), usage: e.usage }))));
            console.log(JSON.stringify(all.filter((e) => e.type === "result").map((e) => ({ subagent_stats: e.subagent_stats, since: e.model_usage_since_last_result }))));
          '
          echo "--- run-usage.mjs"
          node .relevo-plugin-169/scripts/run-usage.mjs --file "$EXECUTION_FILE" --subscription
