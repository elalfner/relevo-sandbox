# Throwaway spikes S1 and S3 of the Relevo change "specialist-review-lenses". Delete this branch afterwards.
# It runs only when it is dispatched by hand, so pushing the workflow alone spends nothing.
name: spike-lens-runtime
on:
  workflow_dispatch:
    inputs:
      what:
        description: spikes or eval
        default: spikes
      lens:
        description: lenses for the evaluation (comma separated)
        default: code,security
      cases:
        description: regex over the case ids
        default: state-update|unescaped|table-without
      budget:
        description: USD cap of each model call in the evaluation
        default: '0.25'
permissions:
  contents: read
jobs:
  effort:
    if: ${{ inputs.what == 'effort' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Write three versions of the same subagent
        run: |
          mkdir -p .claude/agents
          body='Solve the task you are given, show your reasoning briefly, and end with the line ANSWER: <number>.'
          printf '%s\n' '---' 'name: think' 'description: Reasoning probe without an effort in its file.' 'model: sonnet' 'tools: Read' '---' "$body" > .claude/agents/think.md
          printf '%s\n' '---' 'name: think-low' 'description: Reasoning probe whose file says effort low.' 'model: sonnet' 'effort: low' 'tools: Read' '---' "$body" > .claude/agents/think-low.md
          printf '%s\n' '---' 'name: think-max' 'description: Reasoning probe whose file says effort max.' 'model: sonnet' 'effort: max' 'tools: Read' '---' "$body" > .claude/agents/think-max.md
      - id: e1
        name: Launch the same task with different efforts
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: >-
            Use the Agent tool, one call at a time and in this order, ten calls in all. The task for every call is
            exactly: "How many distinct ways are there to tile a 2 by 9 board with 1 by 2 dominoes, and how many of
            them have no two dominoes forming a 2 by 2 square? Give both numbers." Calls 1 and 2: subagent_type think,
            effort low. Calls 3 and 4: subagent_type think, effort max. Calls 5 and 6: subagent_type think, no effort
            parameter. Calls 7 and 8: subagent_type think-low, no effort parameter. Calls 9 and 10: subagent_type
            think-max, no effort parameter. After the ten calls, say only DONE.
          claude_args: --model haiku --max-turns 30 --max-budget-usd 1 --allowedTools "Task,Read"
      - name: Digest of the effort probe
        if: always()
        run: |
          cp "${{ steps.e1.outputs.execution_file }}" spike-e1.json || true
          echo '=== EFFORT DIGEST BEGIN'
          jq -c '(map(select(.type=="assistant")|.message.content[]?|select(.type=="tool_use" and .name=="Agent")|{(.id):.input})|add) as $in | .[] | select(.tool_use_result?.agentType?) | (.message.content[0].tool_use_id) as $id | {agent:.tool_use_result.agentType, effort_in:($in[$id].effort), model_in:($in[$id].model), thinking:.tool_use_result.usage.output_tokens_details.thinking_tokens, out:.tool_use_result.usage.output_tokens, total:.tool_use_result.totalTokens, ms:.tool_use_result.totalDurationMs}' spike-e1.json || true
          jq -c '.[] | select(.type=="result") | {num_turns,subtype,terminal_reason,total_cost_usd}' spike-e1.json || true
          echo '=== EFFORT DIGEST END'
  eval:
    if: ${{ inputs.what == 'eval' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: elalfner/relevo
          ref: plan/specialist-review-lenses
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g @anthropic-ai/claude-code
      - name: Evaluate the lenses on the seeded defects
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          node scripts/eval-lenses.mjs --yes --lens "${{ inputs.lens }}" --cases "${{ inputs.cases }}" --max-budget-usd "${{ inputs.budget }}" --out "$RUNNER_TEMP/eval"
          echo '=== REPORT BEGIN'; cat "$RUNNER_TEMP"/eval/*.md; echo '=== REPORT END'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lens-evaluation
          path: ${{ runner.temp }}/eval
  spikes:
    if: ${{ inputs.what != 'eval' && inputs.what != 'effort' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Write the probe subagent
        run: |
          mkdir -p .claude/agents
          printf '%s\n' '---' 'name: probe' 'description: Spike probe. Answers with the word PROBE and nothing else.' 'model: haiku' 'effort: low' 'tools: Read' '---' 'Answer with the single word PROBE.' > .claude/agents/probe.md
      - id: s1
        name: S1 effort at launch versus in the frontmatter
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: >-
            Launch the subagent 'probe' twice with the Agent tool. First normally. Second passing model=haiku and,
            if the tool accepts it, an effort parameter set to high. Report which parameters the Agent tool accepted,
            quoting any error.
          claude_args: --model haiku --max-turns 6 --max-budget-usd 0.30 --allowedTools "Task,Read"
      - name: Keep the S1 stream
        if: always()
        run: |
          cp "${{ steps.s1.outputs.execution_file }}" spike-s1.json || true
          echo '=== S1 DIGEST BEGIN'
          jq -c '.[] | select(.type=="assistant") | .message.content[]? | select(.type=="tool_use") | {name,input}' spike-s1.json || true
          jq -c '.[] | select(.tool_use_result?) | .tool_use_result | {agentType,resolvedModel,totalTokens}' spike-s1.json || true
          jq -c '.[] | select(.type=="system" and .subtype=="init") | {tools}' spike-s1.json | head -c 1500 || true
          jq -c '[.. | objects | to_entries[] | select(.key|test("effort";"i")) | {(.key): .value}] | unique' spike-s1.json | head -c 1500 || true
          jq -c '.[] | select(.type=="result") | {num_turns,subtype,terminal_reason,total_cost_usd,subagent_stats}' spike-s1.json || true
          echo '=== S1 DIGEST END'
      - id: s3
        name: S3 a low turn limit with a subagent
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: Launch the subagent 'probe' with the Agent tool and report its answer.
          claude_args: --model haiku --max-turns 2 --max-budget-usd 0.30 --allowedTools "Task,Read"
      - name: Keep the S3 stream
        if: always()
        run: |
          cp "${{ steps.s3.outputs.execution_file }}" spike-s3.json || true
          echo '=== S3 DIGEST BEGIN'
          jq -c '.[] | select(.type=="result") | {num_turns,subtype,terminal_reason,total_cost_usd,subagent_stats}' spike-s3.json || true
          echo '=== S3 DIGEST END'
      - name: Write a subagent that needs several turns
        run: |
          for f in a b c; do echo "$f" > "$f.txt"; done
          printf '%s\n' '---' 'name: reader' 'description: Spike reader. Reads a.txt, b.txt and c.txt one call at a time.' 'model: haiku' 'tools: Read' '---' 'Read a.txt, then b.txt, then c.txt. Make exactly one Read call per turn, never several at once. Then answer DONE.' > .claude/agents/reader.md
      - id: s3b
        name: S3b a low turn limit with a subagent that takes several turns
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: Launch the subagent 'reader' with the Agent tool and report its answer.
          claude_args: --model haiku --max-turns 2 --max-budget-usd 0.30 --allowedTools "Task,Read"
      - name: Digest of S3b
        if: always()
        run: |
          cp "${{ steps.s3b.outputs.execution_file }}" spike-s3b.json || true
          echo '=== S3B DIGEST BEGIN'
          jq -c '.[] | select(.type=="result") | {num_turns,subtype,terminal_reason,total_cost_usd,subagent_stats,usage}' spike-s3b.json || true
          jq -c '.[] | select(.type=="system" and .subtype=="task_notification") | {status,summary,usage}' spike-s3b.json || true
          echo '=== S3B DIGEST END'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-streams
          path: spike-s*.json
